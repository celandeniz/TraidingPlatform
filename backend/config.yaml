# M7 Spike-Fade — Phase 1 configuration
# All thresholds live here. No magic numbers in code.

universe:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - TSLA

# Which strategies are active. Adding a strategy = register a key + list it here.
# Mean-reversion: spike_fade, rsi_reversion, vwap_reversion.
# Trend/breakout: ema_momentum, donchian_breakout, macd_cross, keltner_breakout, atr_trend.
# Confirmations: bollinger, volume.
strategies:
  signal:
    - spike_fade
    - ema_momentum
    - donchian_breakout
    - rsi_reversion
    - macd_cross
    - vwap_reversion
    - keltner_breakout
    - atr_trend
  confirmations:
    - bollinger
    - volume

# Trend-follow / breakout signal parameters
ema_momentum:
  fast: 12
  slow: 26
donchian_breakout:
  channel: 20
macd_cross:
  fast: 12
  slow: 26
  signal: 9
keltner_breakout:
  period: 20
  mult: 2.0
atr_trend:
  period: 20
  k: 1.5
# Mean-reversion signal parameters
rsi_reversion:
  period: 14
  oversold: 30
  overbought: 70
vwap_reversion:
  band_pct: 1.0
volume:
  window: 20
  mult: 1.5

# Spike-fade signal parameters (see spec §4)
spike_fade:
  zscore_window: 20      # Zw
  lookback_k: 3          # K
  z_entry: 2.0           # Z_ENTRY
  rsi_period: 14
  rsi_oversold: 30       # RSI_OS
  rsi_overbought: 70     # RSI_OB

# Trend regime classification (logged alongside; no suppression in Phase 1)
regime:
  ema_period: 50
  slope_threshold: 0.0002   # |EMA slope per bar / price| below this => "range".
                            #   Calibrated on real 5m data: 0.0005 left ~88-96% of
                            #   bars classified "range" (filter barely discriminated);
                            #   0.0002 yields a healthy up/down/range split.
  filter_enabled: true      # (A) only take regime-aligned signals: mean-reversion
                            #   in range, momentum/breakout with the trend.
                            #   Validated in walk-forward as an OOS improvement.

# Bollinger multi-timeframe confirmation (see spec §4a)
bollinger:
  period: 20
  std: 2.0
  confirm_min: 3            # >= this many agreeing timeframes => confirmed
  timeframes:
    - 1m
    - 3m
    - 5m
    - 15m
    - 45m
    - 1h

# Data layer
data:
  warmup_bars: 60           # 1m bars fetched at startup to warm indicators
  bar_timeframe: 1m         # primary stream timeframe

# Execution lifecycle + risk (Phase 3). Master switch off => no orders (Phase 1/2 behavior).
risk:
  enabled: false
  allow_equity_short: false       # equity short needs a margin account
  risk_per_trade_pct: 0.5         # % of equity risked per trade
  max_concurrent_positions: 5
  max_position_pct: 20            # cap single-position notional as % of equity
  max_daily_loss_pct: 3.0         # kill-switch trips here

# Realistic execution / fill model (order types, spread, slippage, partial fills,
# TCA). OFF by default => MockBroker keeps full-fill-at-one-price; live adapters
# unchanged. Turn on to model fills the way a real desk experiences them.
execution:
  realistic_fills: false          # route MockBroker fills through the FillModel
  record_tca: false               # log per-order slippage to logs/exec_analytics.jsonl
  fill_model:
    spread_bps: 2.0               # full bid/ask spread; half charged per fill
    base_slippage_bps: 1.0        # fixed adverse slippage per fill
    impact_coef_bps: 50.0         # bps of slippage at 100% of bar volume
    max_participation: 1.0        # cap fill at this fraction of bar volume (1 = no cap)
    commission_bps: 1.0           # per side

# Autonomous LLM action loop (Gemini/Claude/Ollama drives the MCP toolset).
# OFF + dry_run by default. Even when live, every action passes guards + risk +
# kill-switch downstream. Trigger one cycle via POST /api/agent/auto/cycle.
auto_trader:
  enabled: false
  dry_run: true                   # propose only; set false to actually submit
  symbol_whitelist: []            # empty => any (still guard/risk gated)
  min_confidence: 0.6
  max_actions_per_cycle: 3
  max_qty: 10
  include_news: false             # add per-symbol headlines to the LLM context

# Composable pre-trade guard pipeline (stacks in front of the broker, like risk).
# OFF by default. Net-new vs. risk: per-account symbol whitelist + per-symbol
# cooldown. Closing (reduce_only) orders always bypass guards.
guards:
  enabled: false
  symbol_whitelist: []            # empty => allow all; e.g. [AAPL, MSFT]
  cooldown_seconds: 0             # 0 => disabled; min seconds between opens per symbol

# Exit rules (main build spec §4.5)
exits:
  take_profit_pct: 1.5
  stop_loss_pct: 1.0
  trailing_stop_pct: 0.8          # null disables
  time_stop_minutes: 120
  opposite_signal_close: true
  eod_flat_equity: true           # equities flatten before close; crypto ignores
  eod_flat_minutes: 10

# Broker routing (Alpaca equities + ccxt crypto)
brokers:
  default_asset_class: equity
  symbol_overrides: {}            # e.g. {BTC/USDT: crypto, ETH/USDT: crypto}
  # executor override per asset class: omit/"" => default (alpaca paper / ccxt),
  # "mock" => in-memory MockBroker (no network), "ib" => Interactive Brokers.
  # equity: { executor: mock }
  crypto:
    exchange: binance
    sandbox: true                 # Binance testnet = crypto "paper"
    leverage: 1
  mock:
    starting_cash: 100000         # MockBroker opening cash (offline demos / CI)
  ib:                             # Interactive Brokers (TWS/Gateway must be running)
    host: 127.0.0.1
    port: 7497                    # 7497 TWS paper, 7496 TWS live, 4002/4001 Gateway
    client_id: 1
    account: ""                   # blank = default account

# Automation: cron/interval/one-shot schedules + heartbeat + inbound webhooks.
# OFF by default. Schedules drive periodic snapshots / news fetches when on.
scheduler:
  enabled: false
  heartbeat:
    interval_seconds: 300         # tick every 5 min
    active_start_utc: "13:30"     # ~US market open (UTC); null => always active
    active_end_utc: "20:00"       # ~US market close (UTC)
    dedup_seconds: 60
  webhooks_enabled: false         # expose POST /api/hooks/{name} when true

# Account snapshots -> equity curve (logs/snapshots_*.jsonl).
snapshots:
  enabled: false
  interval_seconds: 300

# RSS news aggregation (feedparser) with a searchable archive. OFF by default.
news_rss:
  enabled: false
  retention_days: 14
  feeds: []                       # e.g. [https://feeds.a.dj.com/rss/RSSMarketsMain.xml]

# Perspective (FINOS/JPMorgan) streaming dashboard tables at /static/perspective.html.
# OFF by default; needs the optional `perspective-python` package installed.
perspective:
  enabled: false

# Cross-asset market data (OpenBB) — fundamentals, estimates, earnings, insider,
# movers, symbol search across equities/crypto/fx/commodities/macro.
# OFF by default: enable deliberately (adds the openbb dependency + provider keys).
marketdata:
  enabled: false
  backend: openbb                 # openbb | yahoo (yahoo = free yfinance, no key)
  providers: {}                   # per-asset default, e.g. {equity: fmp, crypto: fmp}
  api_keys: {}                    # inline keys; or set *_api_key in .env

# AI decision & research layer (Phase 2). See spec phase2-ai-decision.
research:
  enabled: true
  news_provider: alpaca
  earnings_block_days: 1              # earnings within N days -> SUPPRESS fade
  block_options_pre_earnings_days: 1  # disable options near earnings (IV crush)
  news_recency_minutes: 30           # hot news within N min -> WITH_TREND_ONLY
  gap_catalyst_pct: 2.5              # abnormal gap proxy threshold
  fundamental:
    enabled: true
    can_veto: false
    cache_hours: 24
  copilot:
    enabled: true
    cache_minutes: 10
  personas:
    enabled: false                   # off by default (cost); enable deliberately
    weights:
      value: 1.0
      momentum: 1.0
      sentiment: 1.0
      contrarian: 1.2
  # TradingAgents-style committee: analysts -> bull/bear debate -> trader -> risk.
  # OFF by default (cost); on-demand; degrades to available=False without a key.
  committee:
    enabled: false
    mode: confirm                    # off | confirm | veto | decide
    debate_rounds: 1                 # hard-clamped to <= 3 in code
    deep_analysts: false             # cheap model for the 5 analyst votes
    deep_debate: false               # cheap model for the back-and-forth
    deep_trader: true                # deep model only for the single synthesis
    risk_llm: false                  # pure-python risk pass unless true
    veto_confidence: 0.6             # used only in mode: veto
    fallback_to_consensus: true      # if unavailable, weighted persona consensus
    cache_minutes: 10
    max_committees_per_min: 3
    weights:                         # for the consensus fallback
      value: 1.0
      momentum: 1.0
      sentiment: 1.0
      contrarian: 1.2
      news_technical: 1.0
  llm:
    provider: ollama                   # ollama (local, default) | claude | gemini
    # Gemini settings (used when provider=gemini, or as fallback). Needs
    # GOOGLE_API_KEY/GEMINI_API_KEY in .env + the google-genai package.
    gemini:
      default_use_case: general
      deep_use_case: reasoning
      models:
        general: gemini-2.0-flash
        fast: gemini-2.0-flash
        reasoning: gemini-2.5-pro
        lightweight: gemini-2.0-flash-lite
    # Claude settings (used when provider=claude, or as fallback)
    model: claude-haiku-4-5-20251001
    model_deep: claude-opus-4-8
    max_calls_per_min: 20
    daily_cost_cap_usd: 5.0
    # Local Ollama settings (default provider). Per-use-case model routing:
    # the tool picks the best local model for each task automatically.
    ollama:
      host: http://localhost:11434
      default_use_case: general
      deep_use_case: reasoning
      request_timeout: 120
      models:
        general: qwen3:14b             # best general
        fast: qwen3:8b                 # faster general
        coding: qwen2.5-coder:14b      # coding
        reasoning: deepseek-r1:14b     # reasoning
        lightweight: gemma3:12b        # lightweight
      # Business-agent roles -> use-case (auto selection). Manual override is
      # possible per call (role/model args) or via the /api/agent/run endpoint.
      roles:
        general_ai: general            # Genel AI çalışanı  -> qwen3:14b
        d365_consultant: general       # D365 danışmanı     -> qwen3:14b
        azure_devops: coding           # Azure DevOps Agent -> qwen2.5-coder:14b
        pmo: general                   # PMO Agent          -> qwen3:14b
        proposal: general              # Proposal Agent     -> qwen3:14b
        analysis: reasoning            # Analiz Agent       -> deepseek-r1:14b
